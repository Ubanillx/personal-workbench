<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>共享工作台</title>
<link rel="stylesheet" href="/share/share.css">
</head>
<body>

<!-- 登录遮罩 -->
<div id="loginMask" hidden>
  <div class="login-box">
    <h2>🔐 共享工作台</h2>
    <p>请输入访问令牌（由工作台主人提供）</p>
    <input id="tokenInput" type="text" placeholder="访问令牌" autocomplete="off" spellcheck="false">
    <button id="loginBtn" class="btn primary">进入工作台</button>
    <div id="loginErr" class="err" hidden></div>
  </div>
</div>

<header>
  <div class="hd-top">
    <h1>📋 共享工作台</h1>
    <span class="updated" id="updated">同步中…</span>
  </div>
  <div class="who" id="whoBox" hidden></div>
  <div class="stats">
    <div class="stat"><b id="statDoing">0</b><span>进行中</span></div>
    <div class="stat"><b id="statDone">0</b><span>已完成</span></div>
    <div class="stat warn"><b id="statOverdue">0</b><span>已逾期</span></div>
  </div>
  <div class="filters">
    <button class="f active" data-f="all">全部</button>
    <button class="f" data-f="doing">进行中</button>
    <button class="f" data-f="done">已完成</button>
  </div>
  <button class="new-task-btn" id="newTaskBtn">＋ 发布任务</button>
  <div class="new-task-box" id="newTaskBox" hidden>
    <input type="text" id="ntTitle" placeholder="任务标题" maxlength="80" />
    <div class="nt-row">
      <select id="ntPriority">
        <option value="P1" selected>P1 中</option>
        <option value="P0">P0 高</option>
        <option value="P2">P2 低</option>
      </select>
      <input type="date" id="ntDue" />
      <select id="ntAssignee" hidden></select>
      <button class="btn primary" id="ntSubmit">发布</button>
    </div>
  </div>
</header>

<main id="list"></main>

<footer>数据保存在工作台主人的电脑上 · 每 10 秒自动刷新</footer>

<script src="/share/share.js"></script>
</body>
</html>
